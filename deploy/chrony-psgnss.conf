# Receiver time from PSGNSS, for /etc/chrony/conf.d/ (Debian) or the end of
# /etc/chrony/chrony.conf.
#
# chronyd creates and listens on this socket; psgnssd connects to it and offers
# one sample per second from UBX-NAV-PVT. Set timesync.chrony_socket in
# psgnss.toml to the same path, then restart both.
#
# This is USB-timestamped time, not PPS: good to a few milliseconds, not
# microseconds. It exists so a headless base with no RTC and no internet has a
# correct clock. Keep a network source too when the Pi has one --- chrony will
# prefer whichever it measures as better.
#
# refid must be at most 4 characters, and must not collide with another
# refclock's: this Pi already has a PPS refclock using GNSS.
#
# precision and delay are not decoration. A SOCK sample carries no uncertainty
# of its own, so chrony assumes it is as precise as the socket read, and would
# then weigh USB-timestamped time as heavily as a PPS edge. Declaring the truth
# --- millisecond precision, tens of milliseconds of path delay --- leaves chrony
# free to prefer better sources whenever they exist, and to fall back to the
# receiver when they do not. That is the job this refclock exists for.
#
# Measured on this station: samples arrive ~12 ms from true, and chrony keeps
# selecting the wired PPS refclock (refid GNSS, sub-microsecond) over it, which
# is correct.
refclock SOCK /run/chrony.psgnss.sock refid UBX poll 4 filter 8 precision 1e-3 delay 0.05

# The socket lives in /run, which is cleared on boot. chronyd creates it, so
# nothing else needs to.
