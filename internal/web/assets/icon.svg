<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PSGNSS base station">
  <title>PSGNSS base station</title>
  <!-- Drawn for 16 pixels, because that is the size a browser tab shows.
       The header's brand mark has four thin orbits and seven satellites; at
       tab size that is a grey haze, which is what the first attempt at this
       looked like. This is the same idea with everything that does not survive
       taken out: one orbit, one station, one satellite.

       The badge is not decoration either. A tab strip may be light or dark and
       a bare mark disappears into one of them, so the icon carries its own
       background and reads the same on both. -->
  <rect width="64" height="64" rx="14" fill="#066fd1"/>
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(-25 32 32)"
           fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="32" cy="32" r="11" fill="#ffffff"/>
  <!-- One satellite, in the GPS green this UI uses everywhere else. It is the
       only colour in the mark, which is what keeps it a satellite rather than
       a smudge at small sizes. -->
  <circle cx="51" cy="18" r="7" fill="#40c057"/>
</svg>
